<style>
:root{--bg:#0c2618;--panel:#123221;--line:#2c5a3e;--green:#95ec69;--orange:#f7931a;--text:#f5f5f0;--gray:#aabeaf;--red:#ff6b6b}
*{box-sizing:border-box}
html,body{margin:0;background:linear-gradient(#0a2819,#1e4628) fixed;color:var(--text);font-family:"PingFang SC","Noto Sans SC","Noto Sans CJK SC","Microsoft YaHei","Hiragino Sans GB",system-ui,sans-serif;-webkit-text-size-adjust:100%}
.wrap{max-width:560px;margin:0 auto;padding:20px 16px 48px}
h1{margin:8px 0 4px;font-size:28px}
h1 small{display:block;color:var(--green);font-size:14px;letter-spacing:2px;margin-bottom:4px}
.sub{color:var(--gray);margin:0 0 14px;line-height:1.6;font-size:15px}
.safe{border:2px solid var(--orange);background:rgba(247,147,26,.12);border-radius:14px;padding:12px 14px;margin:0 0 16px;line-height:1.6}
.safe b{color:var(--orange)}
.safe p{margin:6px 0 0;color:var(--gray);font-size:13px}
form{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px}
label.f{display:block;margin:14px 0 6px;font-weight:600;font-size:15px}
label.f:first-child{margin-top:0}
input[type=text],select,textarea{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:#0b2416;color:var(--text);font-size:16px;font-family:inherit}
input[type=text]:focus,select:focus,textarea:focus{outline:2px solid var(--green);border-color:transparent}
.row2{display:flex;gap:10px}.row2>div{flex:1;min-width:0}
.hint{color:var(--gray);font-size:12px;margin-top:6px;line-height:1.5}
.err{color:var(--red);font-size:14px;margin-top:6px;line-height:1.5;white-space:pre-wrap}
.err.big{font-weight:700;border:2px solid var(--red);border-radius:10px;padding:10px;background:rgba(255,107,107,.1)}
.av{display:flex;align-items:center;gap:12px}
.av img{width:64px;height:64px;border-radius:50%;object-fit:cover;border:3px solid var(--orange);background:#284632}
.av .btns{display:flex;flex-direction:column;gap:6px;flex:1;min-width:0}
.av input[type=file]{font-size:14px;color:var(--gray);max-width:100%}
.nrow{display:flex;gap:8px;align-items:stretch}
.nrow input{flex:1;min-width:0}
.nobag{flex:0 0 auto;padding:0 14px;border-radius:10px;border:1px solid var(--green);background:transparent;color:var(--green);font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap}
.nobag:disabled{opacity:.6}
.info:empty{display:none}
.steps{display:flex;gap:6px;list-style:none;padding:0;margin:4px 0 16px}
.steps li{flex:1;min-width:0;display:flex;align-items:center;gap:6px;padding:8px;border-radius:12px;background:var(--panel);border:1px solid var(--line);color:var(--gray);font-size:13px;font-weight:700}
.steps li span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.steps li b{flex:0 0 22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--line);color:var(--text);font-size:12px}
.steps li.on{border-color:var(--green);color:var(--text)}.steps li.on b{background:var(--green);color:#0b2416}
.steps li.done b{background:#3d7a52}
.step{display:none}.step.on{display:block}
.prog{height:6px;border-radius:3px;background:var(--line);margin-top:12px;overflow:hidden;display:none}
.prog.on{display:block}.prog i{display:block;height:100%;width:0;background:var(--green);transition:width .4s}
.reveal{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px 16px;text-align:center}
.reveal img{width:min(240px,62vw);height:auto;display:block;margin:0 auto 6px;animation:pop .5s ease-out}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
.reveal h2{font-size:24px;margin:4px 0;line-height:1.35}
.lv{display:inline-block;padding:4px 14px;border-radius:999px;color:#141414;font-weight:800;font-size:15px;margin:4px 0}
.enc{color:var(--green);margin:8px 0 12px;font-size:15px;line-height:1.5}
.sum{margin:0;text-align:left}.sum div{display:flex;justify-content:space-between;gap:12px;padding:10px 2px;border-top:1px solid var(--line)}
.sum dt{color:var(--gray);font-size:14px}.sum dd{margin:0;font-weight:800;font-size:16px;text-align:right}
.pctl{color:var(--orange);font-weight:700;margin:10px 0 0;font-size:14px}.pctl:empty{display:none}
.basis{color:var(--gray);font-size:13px;margin:10px 0 0;line-height:1.5}
.reveal .info{text-align:left}
.pick{margin-top:14px}.nexthint{margin:0 0 4px;font-weight:700;color:var(--green)}
.cnt{text-align:right;font-size:12px;color:var(--gray);margin-top:4px}.cnt.over{color:var(--red);font-weight:700}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line);font-size:16px;padding:13px}
.navbtns{margin-top:6px}.navbtns .btn{margin-top:10px}
.rt{font-size:20px;margin:0 0 10px}

.linkbtn{background:none;border:none;color:var(--green);padding:0;font-size:13px;text-align:left;cursor:pointer;font-family:inherit}
.seg{display:flex;gap:8px}.seg label{flex:1;text-align:center;padding:10px;border:1px solid var(--line);border-radius:10px;cursor:pointer}
.seg input{display:none}.seg input:checked+span{color:#123}.seg label:has(input:checked){background:var(--green);color:#123;font-weight:700}
.chk{display:flex;gap:8px;align-items:center;margin-top:12px;font-size:14px;color:var(--gray)}
.btn{display:block;width:100%;padding:15px;border:none;border-radius:14px;font-size:18px;font-weight:800;cursor:pointer;font-family:inherit;margin-top:16px}
.btn.primary{background:var(--green);color:#0b2416}
.btn.orange{background:var(--orange);color:#1b1004}
.btn.dark{background:#000;color:#fff;border:1px solid #444}
.btn:disabled{opacity:.6;cursor:wait}
#status{color:var(--gray);font-size:14px;margin-top:10px;min-height:1.2em}
#cardImg{display:block;width:100%;height:auto;border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,.4);-webkit-touch-callout:default;user-select:auto}
.info{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:12px;font-size:14px;line-height:1.7;color:var(--gray)}
.info div::before{content:"· "}
.topbar{display:flex;justify-content:flex-end}
.lt{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--panel)}
.lt button{background:none;border:none;color:var(--gray);padding:7px 14px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
.lt button.on{background:var(--green);color:#0b2416}
.foot{color:var(--gray);font-size:12px;margin-top:28px;line-height:1.6;text-align:center}
canvas#cv{display:none}
</style>
</head>

<div class="wrap">
  <div class="topbar"><div class="lt" role="group" id="langToggle"><button type="button" data-lang="zh" data-i="card_lang_zh"></button><button type="button" data-lang="en">EN</button></div></div>
  <h1><small>MY RGB ID</small><span data-i="hero_title"></span></h1>
  <p class="sub" data-i="hero_sub"></p>
  <ol class="steps" id="steps">
    <li data-s="1"><b>1</b><span data-i="step_1"></span></li>
    <li data-s="2"><b>2</b><span data-i="step_2"></span></li>
    <li data-s="3"><b>3</b><span data-i="step_3"></span></li>
  </ol>

  <!-- STEP 1: your info -->
  <section class="step" id="step1">
  <div class="safe"><b data-i="safety_line"></b><p data-i="safety_detail"></p></div>
  <form id="f" autocomplete="off" onsubmit="return false">
    <label class="f" for="npub" data-i="label_npub"></label>
    <div class="nrow">
      <input type="text" id="npub" spellcheck="false" autocapitalize="off" autocorrect="off" inputmode="text">
      <button type="button" class="nobag" id="noHold" data-i="btn_no_holding"></button>
    </div>
    <div class="hint" data-i="no_holding_hint"></div>
    <div class="err" id="npubErr"></div>

    <div class="row2">
      <div><label class="f" for="name" data-i="label_name"></label><input type="text" id="name" maxlength="24"></div>
      <div><label class="f" for="handle" data-i="label_handle"></label><input type="text" id="handle" maxlength="16" spellcheck="false" autocapitalize="off"></div>
    </div>
    <div class="err" id="handleErr"></div>

    <label class="f" data-i="label_avatar"></label>
    <div class="av">
      <img id="avPrev" alt="">
      <div class="btns">
        <input type="file" id="avatar" accept="image/*">
        <button type="button" class="linkbtn" id="avClear" data-i="avatar_clear"></button>
      </div>
    </div>
    <div class="hint" data-i="avatar_hint"></div>
    <div class="err" id="avErr"></div>

    <label class="f" for="asset" data-i="label_asset"></label>
    <select id="asset"></select>

    <button class="btn primary" id="go" type="button" data-i="btn_next"></button>
    <div class="prog" id="prog"><i></i></div>
    <div id="status"></div>
    <div class="err big" id="mainErr" style="display:none"></div>
  </form>
  </section>

  <!-- STEP 2: your tier -->
  <section class="step" id="step2">
    <div class="reveal">
      <img id="revFrog" alt="">
      <h2 id="revTitle"></h2>
      <div class="lv" id="revLv"></div>
      <p class="enc" id="revEnc"></p>
      <dl class="sum">
        <div><dt id="sumL0"></dt><dd id="sumV0"></dd></div>
        <div><dt id="sumL1"></dt><dd id="sumV1"></dd></div>
        <div><dt id="sumL2"></dt><dd id="sumV2"></dd></div>
      </dl>
      <p class="pctl" id="revPct"></p>
      <p class="basis" data-i="reveal_basis"></p>
      <div class="info" id="info"></div>
    </div>
    <form class="pick" autocomplete="off" onsubmit="return false">
      <p class="nexthint" data-i="reveal_next"></p>
      <label class="f" for="ident" data-i="label_identity"></label>
      <select id="ident"></select>
      <label class="f" for="slogan" data-i="label_slogan"></label>
      <select id="slogan"></select>
      <div id="customWrap" style="display:none">
        <textarea id="sloganCustom" rows="2"></textarea>
        <div class="cnt" id="sloganCnt"></div>
      </div>
      <label class="chk" id="pctChk"><input type="checkbox" id="showPct" checked><span data-i="label_show_pct"></span></label>
      <button class="btn primary" id="make" type="button" data-i="btn_generate"></button>
      <button class="btn ghost" id="back1" type="button" data-i="btn_back_info"></button>
    </form>
  </section>

  <!-- STEP 3: the card -->
  <section class="step" id="step3">
    <h2 class="rt" data-i="result_title"></h2>
    <img id="cardImg" alt="">
    <button class="btn orange" id="save" type="button" data-i="btn_save"></button>
    <div class="hint" data-i="save_hint"></div>
    <button class="btn dark" id="shareX" type="button" data-i="btn_share_x"></button>
    <div class="hint" id="shareHint"></div>
    <div class="row2 navbtns">
      <button class="btn ghost" id="back2" type="button" data-i="btn_back_edit"></button>
      <button class="btn ghost" id="restart" type="button" data-i="btn_restart"></button>
    </div>
  </section>

  <div class="foot" data-i="footer_note"></div>
</div>
<canvas id="cv" width="1080" height="1350"></canvas>

/* ---------- bech32 (BIP-173) decode for npub ---------- */
const B32 = 'qpzry9x8gf2tvdw0s3jn54khce6mua7l';
function polymod(v){const G=[0x3b6a57b2,0x26508e6d,0x1ea119fa,0x3d4233dd,0x2a1462b3];let c=1;for(const x of v){const b=c>>25;c=((c&0x1ffffff)<<5)^x;for(let i=0;i<5;i++)if((b>>i)&1)c^=G[i];}return c;}
function hrpExpand(h){const r=[];for(const ch of h)r.push(ch.charCodeAt(0)>>5);r.push(0);for(const ch of h)r.push(ch.charCodeAt(0)&31);return r;}
function bech32Decode(s){
  s=s.toLowerCase();const p=s.lastIndexOf('1');if(p<1)throw 'format';
  const hrp=s.slice(0,p),data=[];for(const ch of s.slice(p+1)){const i=B32.indexOf(ch);if(i<0)throw 'format';data.push(i);}
  if(data.length<6)throw 'format';
  if(polymod(hrpExpand(hrp).concat(data))!==1)throw 'checksum';
  const d=data.slice(0,-6);let acc=0,bits=0;const out=[];
  for(const v of d){acc=(acc<<5)|v;bits+=5;while(bits>=8){bits-=8;out.push((acc>>bits)&255);}}
  return {hrp,bytes:out};
}
function npubToHex(input){
  const s=input.trim();
  if(/^nsec1/i.test(s)) throw {k:'err_nsec',big:true};
  if(s.split(/\s+/).length>=11) throw {k:'err_mnemonic',big:true};
  if(/^[0-9a-f]{64}$/i.test(s)) throw {k:'err_hex'};
  if(!/^npub1[02-9ac-hj-np-z]{58}$/i.test(s)) throw {k:'err_npub_format'};
  let r;try{r=bech32Decode(s);}catch(e){throw {k:e==='checksum'?'err_npub_checksum':'err_npub_format'};}
  if(r.hrp!=='npub'||r.bytes.length!==32) throw {k:'err_npub_format'};
  return r.bytes.map(b=>b.toString(16).padStart(2,'0')).join('');
}

/* ---------- polite API client: serial queue + throttle + retry + cache ---------- */
let lastCall=0, chain=Promise.resolve();
function api(path, body, {cacheKey}={}){
  if(cacheKey){try{const c=JSON.parse(sessionStorage.getItem(cacheKey)||'null');if(c&&Date.now()-c.t<CONFIG.CACHE_TTL_MS)return Promise.resolve(c.v);}catch{}}
  const run=async()=>{
    for(let attempt=0;attempt<4;attempt++){
      const wait=lastCall+CONFIG.THROTTLE_MS*(attempt+1)-Date.now(); if(wait>0) await new Promise(r=>setTimeout(r,wait));
      lastCall=Date.now();
      let res;
      try{
        const ac=new AbortController();const to=setTimeout(()=>ac.abort(),20000);
        res=await fetch(CONFIG.API+path,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body),signal:ac.signal});
        clearTimeout(to);
      }catch(e){ if(attempt===3) throw {k:'err_network'}; await new Promise(r=>setTimeout(r,1500*(attempt+1))); continue; }
      if(res.status===429||res.status>=500){ if(attempt===3) throw {k:res.status===429?'err_rate':'err_network'}; await new Promise(r=>setTimeout(r,2000*(attempt+1))); continue; }
      const j=await res.json();
      if(j.code!==0) throw {k:'err_network',detail:j.msg};
      if(cacheKey){try{sessionStorage.setItem(cacheKey,JSON.stringify({t:Date.now(),v:j.data}));}catch{}}
      return j.data;
    }
  };
  const p=chain.then(run,run); chain=p.catch(()=>{}); return p;
}

/* ---------- dates (UTC+8) ---------- */
const DAY=86400000;
const dayIndex=ms=>{const d=new Date(ms);return Math.round(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/DAY);}  // local calendar day number
const dateIdx=s=>Math.round(Date.parse(s+'T00:00:00Z')/DAY);                    // 'YYYY-MM-DD' → same day numbering
const localMidnight=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d).getTime();};
function fmtDate(ms){const d=new Date(ms);return d.getFullYear()+'.'+String(d.getMonth()+1).padStart(2,'0')+'.'+String(d.getDate()).padStart(2,'0');}

async function percentile(tk,myBal){
  const s=await api('/assets/api/getHolderSummary',{assetId:tk.token},{cacheKey:'lnfi_hs_'+tk.token});
  const count=s?.data?.holderCount||0; if(!count) return null;
  const pages=Math.ceil(count/100);
  // find first page whose last element balance <= myBal
  let lo=1,hi=pages;
  while(lo<hi){const mid=(lo+hi)>>1;const pg=await holderPage(tk.token,mid);const last=pg[pg.length-1];if(!last||last.balance<=myBal)hi=mid;else lo=mid+1;}
  const pg=await holderPage(tk.token,lo);
  const greater=(lo-1)*100+pg.filter(h=>h.balance>myBal).length;
  const lower=Math.max(0,count-greater-1);   // OTHER holders strictly below you (ties count as not beaten)
  const raw=lower/Math.max(1,count-1)*100;   // share of other holders you beat
  const pct=Math.min(99.9,Math.floor(raw*10)/10);            // never displays 100%
  const top=Math.max(0.1,Math.ceil((greater+1)/count*1000)/10);
  const f=x=>x>=99||x<1?x.toFixed(1):String(Math.floor(x));
  return {count,raw,pct,pctTxt:f(pct),top,topTxt:top<1?top.toFixed(1):String(Math.ceil(top))};
}

/* ---------- 入坑时间 / 持仓天数 from Lnfi tokenEvents ----------
   POST /assets/api/tokenEvents {type:'', token:<asset NAME e.g. "PPRGB">, eventId:'', address:<hex pubkey>, page, count:100}
   returns transfer / transferFrom / approve events where address is sender OR receiver, newest first.
   We replay backwards from the current balance: the newest incoming event before which the balance was 0
   is the start of the current holding streak (持仓天数). The earliest incoming event ever is 入坑时间.        */
async function holdingHistory(tk,hex,curRaw,onPage){
  const evs=[];let sum=0,page=1,truncated=false;
  const fetchPage=async p=>{const d=await api('/assets/api/tokenEvents',{type:'',token:tk.name,eventId:'',address:hex,page:p,count:100});sum=d.sumCount||0;return d.tokenTransactionPOS||[];};
  do{ onPage(page); const rows=await fetchPage(page); evs.push(...rows); if(!rows.length)break; page++; }
  while(evs.length<sum && page<=CONFIG.MAX_EVENT_PAGES);
  let oldest=evs;
  if(evs.length<sum){ // very active address: also read the oldest 2 pages for the first-ever receive
    truncated=true; onPage(-1);
    const lastP=Math.ceil(sum/100); oldest=[];
    for(const p of [lastP-1,lastP]) if(p>CONFIG.MAX_EVENT_PAGES) oldest.push(...await fetchPage(p));
    oldest=oldest.concat(evs);
  }
  const mine=e=>(e.tokenAddress===tk.token||e.token===tk.name)&&e.type!=='approve'&&Number(e.amount)>0;
  const isIn=e=>e.toAddress===hex&&e.fromAddress!==hex;
  const floor=localMidnight(CONFIG.FLOOR_DATE);
  const ins=oldest.filter(e=>mine(e)&&isIn(e)).map(e=>e.createAt*1000).filter(ms=>ms>=floor-DAY); // ignore anything before Lnfi listing
  const first=ins.length?Math.max(floor,Math.min(...ins)):null;
  // streak replay (newest → oldest)
  let bal=curRaw,start=null,reset=false;
  const seq=evs.filter(mine).sort((a,b)=>b.createAt-a.createAt||(b.sequence||0)-(a.sequence||0));
  for(const e of seq){
    const d=(e.toAddress===hex?Number(e.amount):0)-(e.fromAddress===hex?Number(e.amount):0);
    const before=bal-d;
    if(d>0&&before<=0){start=e.createAt*1000;break;}
    bal=before;
  }
  let approx=false;
  if(first&&start&&start>first+DAY) reset=true;
  if(!start&&first){start=first;approx=truncated;}
  if(start) start=Math.max(start,floor);
  return {first,start,reset,approx};
}

/* ---------- level formula ----------
   timeScore   = min(50, daysHeld / daysBetween(2025-07-16, today) * 50)          (0 if 入坑时间 not found)
   amountScore = min(50, beatPct / 100 * 50)   beatPct = % of Lnfi holders of this asset with a smaller balance
                 (asset-agnostic; fallback if holder list unavailable:
                  min(50, max(0, log10(amt/A0) / log10(A1/A0)) * 50), A0=100, A1=200,000 PPRGB, scaled by supply)
   score = timeScore + amountScore (0–100);  tiers: 蛙卵 <25 ≤ 蝌蚪 <50 ≤ 青蛙 <75 ≤ 蛙王;  balance 0 → 围观中   */
function scoreOf(tk,amt,daysHeld,todayIdx,pct){
  const span=Math.max(1,todayIdx-dateIdx(CONFIG.FLOOR_DATE));
  const k=tk.supply/tk.mult/CONFIG.PPRGB_SUPPLY||1;
  const a0=CONFIG.AMOUNT_A0*k,a1=CONFIG.AMOUNT_A1*k;
  const ts=daysHeld==null?0:Math.min(50,daysHeld/span*50);
  const as=amt<=0?0:(pct?Math.min(50,pct.raw/100*50):Math.min(50,Math.max(0,Math.log10(amt/a0)/Math.log10(a1/a0))*50));
  return {ts,as,score:ts+as};
}
function tierOf(amt,score){
  if(amt<=0) return CONFIG.TIERS[0];
  let r=CONFIG.TIERS[1];for(const x of CONFIG.TIERS.slice(1)) if(score>=x.min) r=x; return r;
}
function niceRound(x){if(x<=1)return 1;const e=Math.pow(10,Math.floor(Math.log10(x)));const m=x/e;return (m<1.5?1:m<3.5?2:m<7.5?5:10)*e;}
function bucketOf(tk,amt){
  if(amt<=0) return '0';
  const k=tk.supply/tk.mult/CONFIG.PPRGB_SUPPLY||1;
  const b=CONFIG.BUCKETS.map(x=>k===1?x:niceRound(x*k)); const f=n=>n.toLocaleString('en-US');
  if(amt<b[0]) return '< '+f(b[0]);
  for(let i=1;i<b.length;i++) if(amt<b[i]) return f(b[i-1])+' – '+f(b[i]);
  return '> '+f(b[b.length-1]);
}

/* ---------- card renderer (mirrors designer's make_card.py, 1080×1350) ---------- */
const EMOJI_FF='"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji"';
const CJK_FF='"PingFang SC","Noto Sans CJK SC","Noto Sans SC","Microsoft YaHei","Hiragino Sans GB",sans-serif';
const fB=n=>`700 ${n}px ${CJK_FF},${EMOJI_FF}`, fR=n=>`400 ${n}px ${CJK_FF},${EMOJI_FF}`;
const TXT_DY=13;   // canvas 'top' baseline sits ~13px above PIL's text origin for these sizes
const ART_CACHE={};
function artImg(key){ if(ART_CACHE[key]) return ART_CACHE[key];
  return ART_CACHE[key]=new Promise(r=>{const im=new Image();im.onload=()=>r(im);im.onerror=()=>r(null);im.src=CONFIG.ART[key]||'';}); }
function rr(c,x0,y0,x1,y1,r){c.beginPath();c.moveTo(x0+r,y0);c.arcTo(x1,y0,x1,y1,r);c.arcTo(x1,y1,x0,y1,r);c.arcTo(x0,y1,x0,y0,r);c.arcTo(x0,y0,x1,y0,r);c.closePath();}
const GLUE=/^([，。！？、；：”’）》」』,.!?;:)\]"'…~～]|\p{Extended_Pictographic}|\uFE0F|\u200D)/u;
function wrapQuote(c,q,lang,maxW,maxLines){
  c.font=fR(40);
  let toks=lang==='en'?q.split(' '):Array.from(q); const sep=lang==='en'?' ':'';
  const g=[]; for(const tk of toks){ if(g.length&&GLUE.test(tk)) g[g.length-1]+=sep+tk; else g.push(tk); }   // keep punctuation/emoji with the previous token
  const lines=[]; let cur='';
  for(const tk of g){ const nxt=cur?cur+sep+tk:tk; if(cur&&c.measureText(nxt).width>maxW){lines.push(cur);cur=tk;} else cur=nxt; }
  if(cur) lines.push(cur);
  if(lines.length>maxLines){ let l=lines[maxLines-1]; while(l.length>1&&c.measureText(l+'…').width>maxW) l=Array.from(l).slice(0,-1).join(''); lines.length=maxLines; lines[maxLines-1]=l+'…'; }
  return lines;
}
async function drawCard(p){
  const L=CARD_L[p.lang]||CARD_L.zh, cv=$('cv'), c=cv.getContext('2d'), W=1080, H=1350;
  const ORANGE='#f7931a', GREEN='#95ec69', WHITE='#f5f5f0', GRAY='#aabeaf';
  const tx=(s,x,y,font,fill,align='left')=>{c.font=font;c.fillStyle=fill;c.textAlign=align;c.textBaseline='top';c.fillText(s,x,y+TXT_DY);};
  const mw=(s,font)=>{c.font=font;return c.measureText(s).width;};
  const [frog]=await Promise.all([artImg(p.tier.key)]);
  // background
  const gr=c.createLinearGradient(0,0,0,H); gr.addColorStop(0,'rgb(10,40,25)'); gr.addColorStop(1,'rgb(30,70,40)'); c.fillStyle=gr; c.fillRect(0,0,W,H);
  rr(c,50,50,W-50,H-50,40); c.lineWidth=4; c.strokeStyle=GREEN; c.stroke();
  tx(L.kicker||'MY RGB ID',90,90,fB(44),GREEN);
  tx(L.title,90,145,fB(64),WHITE);
  tx(p.no,W-90,100,fB(40),ORANGE,'right');
  // avatar
  c.beginPath(); c.arc(200,380,114,0,Math.PI*2); c.fillStyle=ORANGE; c.fill();
  const av=p.avatar&&p.avatar.naturalWidth?p.avatar:null;
  c.save(); c.beginPath(); c.arc(200,380,110,0,Math.PI*2); c.clip();
  if(av){ const s=Math.max(220/av.naturalWidth,220/av.naturalHeight), w=av.naturalWidth*s, h=av.naturalHeight*s; c.drawImage(av,200-w/2,380-h/2,w,h); }
  else { c.fillStyle='rgb(40,70,50)'; c.fillRect(90,270,220,220); }
  c.restore();
  if(!av) tx(L.avatar,200,355,fB(36),GRAY,'center');
  // tier frog (right), max 300px box
  let frogX=W-90-300;
  if(frog){ const s=300/Math.max(frog.naturalWidth,frog.naturalHeight), w=frog.naturalWidth*s, h=frog.naturalHeight*s; frogX=W-90-w; c.drawImage(frog,frogX,250+(300-h)/2,w,h); }
  // name (never runs under the frog) + handle
  const nameMax=Math.min(420,frogX-345-16); let nm=(p.name||'').trim()||L.noname; const full=nm;
  while(mw(nm,fB(52))>nameMax&&Array.from(nm).length>1) nm=Array.from(nm).slice(0,-1).join('');
  if(nm!==full){ nm=Array.from(nm).slice(0,-1).join('')+'…'; }
  tx(nm,345,290,fB(52),WHITE);
  if(p.handle) tx(p.handle,345,360,fR(34),GRAY);
  // tier tag
  const lv=CONFIG.TIERS.findIndex(x=>x.key===p.tier.key), tname=(L.tiers||{})[p.tier.key]||p.tier.zh;
  const tag=lv<=0?tname:`${tname} · Lv.${lv}`, tw=mw(tag,fB(36));
  rr(c,345,420,345+tw+50,478,29); c.fillStyle=p.tier.color; c.fill();
  { c.font=fB(36); c.fillStyle='#141414'; c.textAlign='left'; c.textBaseline='alphabetic'; const m=c.measureText(tag); const a=m.actualBoundingBoxAscent||27, d=m.actualBoundingBoxDescent||6; c.fillText(tag,370,449+(a-d)/2); }
  if(p.pct) tx(p.pct,345,500,fR(28),GRAY);
  // rows
  let y=600; const vals=[p.since,p.days,p.range,p.asset,p.countdown];
  (L.rows||[]).forEach((k,i)=>{
    tx(k,100,y,fR(38),GRAY);
    let v=String(vals[i]??''); const maxV=W-200-mw(k,fR(38))-30;
    while(mw(v,fB(46))>maxV&&v.length>1) v=v.slice(0,-1);
    tx(v,W-100,y-6,fB(46),WHITE,'right');
    y+=88; c.beginPath(); c.moveTo(100,y-22); c.lineTo(W-100,y-22); c.lineWidth=2; c.strokeStyle='rgb(60,90,70)'; c.stroke();
  });
  // quote
  const lines=wrapQuote(c,'"'+p.quote+'"',p.lang,W-230,2);
  lines.forEach((l,i)=>tx(l,100,y+(lines.length<2?15:0)+i*52,fR(40),GREEN));
  // cta + footer
  let cs=40; while(mw(L.cta,fB(cs))>W-200&&cs>28) cs--; tx(L.cta,100,H-180,fB(cs),WHITE);
  let fs=28; while(mw(L.foot,fR(fs))>W-200&&fs>14) fs--; tx(L.foot,100,H-120,fR(fs),ORANGE);
  c.textAlign='left';
}

  const L=CARD_L[LANG]||CARD_L.zh, k=d.tier.key, tname=(L.tiers||{})[k]||d.tier.zh;
  const lv=CONFIG.TIERS.findIndex(x=>x.key===k);
  $('revFrog').src=CONFIG.ART[k]||''; $('revFrog').alt=tname;
  $('revTitle').textContent=t('reveal_title',{tier:tname});
  $('revLv').textContent=lv>0?`${tname} · Lv.${lv}`:tname; $('revLv').style.background=d.tier.color;
  $('revEnc').textContent=t('reveal_tier_'+k);
  const v=summaryVals(d,L);
  [v.since,v.days,v.range].forEach((x,i)=>{ $('sumL'+i).textContent=L.rows[i]; $('sumV'+i).textContent=x; });
  $('revPct').textContent=(d.pct&&d.amt>0)?t('info_rank',{top:d.pct.topTxt,pct:d.pct.pctTxt,count:d.pct.count.toLocaleString('en-US')}):'';
  $('pctChk').style.display=(d.pct&&d.amt>0)?'flex':'none';
  renderInfo();
}
$('go').onclick=generate;
$('make').onclick=()=>goStep(3);
$('back1').onclick=()=>history.back();
$('back2').onclick=()=>history.back();
$('restart').onclick=()=>{ goStep(1); };

async function render(){
  const d=lastData; if(!d||step!==3) return;
  const lang=LANG, L=CARD_L[lang]||CARD_L.zh;
  const daysTxt=n=>n==null?L.not_found:(n<1?L.day1:(lang==='en'?`${n.toLocaleString('en-US')} ${L.days_unit||'days'}`:`${n} ${L.days_unit||'天'}`));
  const todayIdx=dayIndex(Date.now()); d.todayIdx=todayIdx;   // recomputed at every render
  const home=dateIdx(CONFIG.USDT_HOME_DATE)-todayIdx;
  const zero=d.amt<=0;
  await drawCard({
    lang, tier:d.tier, no:d.hex?'#'+d.hex.slice(-4).toUpperCase():'#0000',
    name:$('name').value, handle:normHandle().v||'', avatar:avatarImg||defaultAvatar,
    since: zero?t('card_since_none'):(d.hist.first?fmtDate(d.hist.first):L.not_found),
    days:  zero?t('card_days_none'):daysTxt(d.daysHeld),
    range: zero?t('card_range_none'):bucketOf(d.tk,d.amt), asset:'$'+d.tk.name,
    countdown: home>0?daysTxt(home):home===0?L.today:L.home_past.replace('{n}',-home),
    quote: sloganText(),
    pct: ($('showPct').checked&&d.pct&&!zero)?L.beats.replace('{p}',d.pct.pctTxt):'',
  });
  const blob=await new Promise(r=>$('cv').toBlob(r,'image/png'));
  lastBlob=blob; if($('cardImg').dataset.url) URL.revokeObjectURL($('cardImg').dataset.url);
  const u=URL.createObjectURL(blob); $('cardImg').src=u; $('cardImg').dataset.url=u;
}

$('save').onclick=()=>{ if(!lastBlob) return; const a=document.createElement('a'); a.href=$('cardImg').src; a.download='my-rgb-id-card.png'; document.body.appendChild(a); a.click(); a.remove(); };
$('shareX').onclick=async()=>{
  if(!lastBlob||!lastData) return;
  const lang=LANG, L=CARD_L[lang]||CARD_L.zh;
  const tierName=(L.tiers||{})[lastData.tier.key]||lastData.tier.zh;
  const text=(lang==='en'?CONFIG.TWEET_TEXT_EN:CONFIG.TWEET_TEXT_ZH).replace('{tier}',tierName)+'\n'+CONFIG.SITE_URL+'\n'+((lang==='en'?CONFIG.TWEET_TAGS_EN:CONFIG.TWEET_TAGS_ZH)||CONFIG.TWEET_TAGS);
  const file=new File([lastBlob],'my-rgb-id-card.png',{type:'image/png'});
  const mobile=/Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
  if(mobile&&navigator.canShare&&navigator.canShare({files:[file]})){
    try{ await navigator.share({files:[file],text:text+'\n'+CONFIG.SITE_URL}); setMsg('shareHint','share_hint_webshare'); return; }
    catch(e){ if(e&&e.name==='AbortError') return; }
  }
  setMsg('shareHint','share_hint_no_image');
  window.open('https://x.com/intent/post?text='+encodeURIComponent(text),'_blank','noopener');
};

loadTokens().then(fillSlogans);
fillSlogans();
showStep(1);
</script>
